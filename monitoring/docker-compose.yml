# Local monitoring for gfilho.net: metrics (Prometheus + exporters), logs (Loki + Alloy) and Grafana.
# Installed to /opt/gfilho-monitoring and started by monitoring/install-monitoring.sh (run inside WSL as root).
#
# Every service uses the host network but listens on 127.0.0.1 only, so nothing is reachable from the LAN:
#   Grafana 3000 · Loki 3100/9096 · Prometheus 9091 · node-exporter 9100 · nginx-exporter 9113
#   blackbox-exporter 9115 · Alloy 12345
# (9090 belongs to the Ascender lab's own Prometheus, which this stack does not touch.)

name: gfilho-monitoring

x-defaults: &defaults
  restart: unless-stopped
  network_mode: host
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9091
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus

  blackbox-exporter:
    <<: *defaults
    image: prom/blackbox-exporter:v0.29.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox:/etc/blackbox:ro

  nginx-exporter:
    <<: *defaults
    image: nginx/nginx-prometheus-exporter:1.5.3
    command:
      - --nginx.scrape-uri=http://127.0.0.1:8090/stub_status
      - --web.listen-address=127.0.0.1:9113

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.systemd
      - --collector.systemd.unit-include=(nginx|cloudflared|docker|logrotate|gfilho-metrics)\.(service|timer)
      - --collector.systemd.enable-restarts-metrics
      - --collector.textfile.directory=/host/var/lib/gfilho-monitoring/textfile
      # /mnt/c stays in: the WSL virtual disk is a file on C:, so C: is the real space limit; other /mnt mounts are out
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|mnt/[^c].*|mnt/c.+|usr/lib/wsl|var/lib/docker/.+|var/lib/kubelet/.+|var/lib/rancher/.+)($$|/)
    volumes:
      - /:/host:ro   # WSL's root is a private mount, so rslave is not available
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

  loki:
    <<: *defaults
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki:/loki

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy:/var/lib/alloy/data
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on: [loki]

  grafana:
    <<: *defaults
    image: grafana/grafana-oss:13.0.2
    env_file: /etc/gfilho-monitoring/grafana.env   # GF_SECURITY_ADMIN_PASSWORD, generated by the installer, never in Git
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # read-only view without login; only reachable from this PC (loopback)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gfilho.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  prometheus:
  loki:
  alloy:
  grafana:
