# Site exporters for guilhermefilho.com (CT 107). Prometheus, Loki, Grafana and the alerts live in the gfhomelab
# observability stack (CT 108, github.com/biazini/gfhomelab-observability) since 2026-11-18; this compose keeps only
# what has to run next to the site. Installed to /opt/gfilho-monitoring by monitoring/install-monitoring.sh.
#
# Every service uses the host network and listens on the CT address 10.10.10.26; nftables
# (monitoring/nftables/gfilho.nft) lets only CT 108 (10.10.10.27) reach these ports:
#   node-exporter 9100 · nginx-exporter 9113 · blackbox-exporter 9115 (origin probes) · Alloy 12345
#   (cloudflared's own metrics: 10.10.10.26:20241)
# The old Prometheus, Loki and Grafana volumes (gfilho-monitoring_prometheus, _loki, _grafana) are kept, unused.

name: gfilho-monitoring

x-defaults: &defaults
  restart: unless-stopped
  network_mode: host
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  blackbox-exporter:
    <<: *defaults
    image: prom/blackbox-exporter:v0.29.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=10.10.10.26:9115
    volumes:
      - ./blackbox:/etc/blackbox:ro

  nginx-exporter:
    <<: *defaults
    image: nginx/nginx-prometheus-exporter:1.5.3
    command:
      - --nginx.scrape-uri=http://127.0.0.1:8090/stub_status
      - --web.listen-address=10.10.10.26:9113

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
      - --path.rootfs=/host
      # the CT's own /proc: lxcfs gives it the container's memory and uptime (the Docker /proc shows the whole host)
      - --path.procfs=/host/proc
      - --web.listen-address=10.10.10.26:9100
      - --collector.systemd
      - --collector.systemd.unit-include=(nginx|cloudflared|docker|logrotate|gfilho-metrics)\.(service|timer)
      - --collector.systemd.enable-restarts-metrics
      - --collector.textfile.directory=/host/var/lib/gfilho-monitoring/textfile
      # only "/" (the CT 107 disk) counts; bind mounts such as /opt/gfilho-website live on the Proxmox host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|mnt|opt/gfilho-website|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro   # the container's root is a private mount, so rslave is not available
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=10.10.10.26:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy:/var/lib/alloy/data
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

volumes:
  alloy:
