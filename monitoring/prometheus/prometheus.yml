# Prometheus for gfilho.net (127.0.0.1:9091). Targets are all on loopback.
# Every probe carries a "check" label: the readable name shown on the dashboard.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9091"] }]

  - job_name: node            # WSL host: CPU, memory, disk, network, systemd units, custom gfilho_* metrics
    static_configs: [{ targets: ["127.0.0.1:9100"] }]

  - job_name: nginx           # stub_status via nginx-prometheus-exporter
    static_configs: [{ targets: ["127.0.0.1:9113"] }]

  - job_name: cloudflared     # built-in metrics server of the tunnel daemon
    static_configs: [{ targets: ["127.0.0.1:20241"] }]

  - job_name: loki
    static_configs: [{ targets: ["127.0.0.1:3100"] }]

  - job_name: alloy
    static_configs: [{ targets: ["127.0.0.1:12345"] }]

  # Full public path: DNS -> Cloudflare -> tunnel -> nginx. Fails when any link breaks.
  - job_name: blackbox_public
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_site] }
    static_configs:
      - { targets: ["https://gfilho.net/"], labels: { check: "Public · Home page" } }
      - { targets: ["https://gfilho.net/cases/self-healing/"], labels: { check: "Public · Case: self-healing" } }
      - { targets: ["https://gfilho.net/cases/ascender-k3s/"], labels: { check: "Public · Case: Ascender on k3s" } }
    relabel_configs: &blackbox_relabel
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "127.0.0.1:9115" }

  # nginx directly, without Cloudflare or the tunnel
  - job_name: blackbox_origin
    metrics_path: /probe
    params: { module: [http_origin] }
    static_configs:
      - { targets: ["http://127.0.0.1:8088/"], labels: { check: "Origin · Production :8088" } }
      - { targets: ["http://127.0.0.1:8089/"], labels: { check: "Origin · Staging :8089" } }
    relabel_configs: *blackbox_relabel

  # canonical-host and trailing-slash redirects must stay 301
  - job_name: blackbox_redirects
    scrape_interval: 5m
    metrics_path: /probe
    params: { module: [http_redirect] }
    static_configs:
      - { targets: ["http://gfilho.net/"], labels: { check: "Redirect · HTTP → HTTPS" } }
      - { targets: ["https://www.gfilho.net/"], labels: { check: "Redirect · www → apex" } }
      - { targets: ["https://gfilho.net/cases/self-healing"], labels: { check: "Redirect · Trailing slash" } }
    relabel_configs: *blackbox_relabel

  - job_name: blackbox_dns
    scrape_interval: 5m
    metrics_path: /probe
    params: { module: [dns_a] }
    static_configs:
      - { targets: ["1.1.1.1:53"], labels: { check: "DNS · Cloudflare 1.1.1.1" } }
      - { targets: ["8.8.8.8:53"], labels: { check: "DNS · Google 8.8.8.8" } }
    relabel_configs: *blackbox_relabel
