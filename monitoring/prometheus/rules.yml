# Alert rules for gfilho.net. There is no Alertmanager: firing and pending alerts are shown on the
# Grafana Overview dashboard ("Alerts now", "Alert history"). For notifications while the whole PC is
# off, use an external uptime monitor as well (see README, "Monitoring").
# Unit tests: rules.test.yml (promtool, see README).
groups:
  - name: gfilho-site
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox_public"} == 0
        for: 2m
        labels: { severity: critical, component: site }
        annotations: { summary: "Public page not answering 200: {{ $labels.instance }}" }

      - alert: OriginDown
        expr: probe_success{job="blackbox_origin", instance="http://127.0.0.1:8088/"} == 0
        for: 1m
        labels: { severity: critical, component: nginx }
        annotations: { summary: "Production nginx (127.0.0.1:8088) is not answering" }

      - alert: StagingDown
        expr: probe_success{job="blackbox_origin", instance="http://127.0.0.1:8089/"} == 0
        for: 5m
        labels: { severity: warning, component: nginx }
        annotations: { summary: "Staging nginx (127.0.0.1:8089) is not answering" }

      - alert: RedirectBroken
        expr: probe_success{job="blackbox_redirects"} == 0
        for: 10m
        labels: { severity: warning, component: site }
        annotations: { summary: "301 redirect missing: {{ $labels.instance }}" }

      - alert: DnsResolutionFailing
        expr: probe_success{job="blackbox_dns"} == 0
        for: 10m
        labels: { severity: warning, component: dns }
        annotations: { summary: "gfilho.net does not resolve via {{ $labels.instance }}" }

      - alert: TlsCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{instance="https://gfilho.net/"} - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning, component: tls }
        annotations: { summary: "TLS certificate expires in less than 14 days" }

      - alert: SecurityTxtExpiringSoon
        expr: (gfilho_security_txt_expires_timestamp_seconds - time()) / 86400 < 30
        for: 1h
        labels: { severity: warning, component: site }
        annotations: { summary: "security.txt expires in less than 30 days" }

  - name: gfilho-services
    rules:
      - alert: TunnelDown
        expr: up{job="cloudflared"} == 0 or cloudflared_tunnel_ha_connections == 0
        for: 1m
        labels: { severity: critical, component: tunnel }
        annotations: { summary: "Cloudflare Tunnel has no edge connections" }

      - alert: TunnelDegraded
        expr: cloudflared_tunnel_ha_connections < 2
        for: 5m
        labels: { severity: warning, component: tunnel }
        annotations: { summary: "Tunnel has fewer than 2 edge connections" }

      - alert: NginxExporterDown
        expr: nginx_up == 0
        for: 2m
        labels: { severity: warning, component: nginx }
        annotations: { summary: "nginx stub_status is not answering" }

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels: { severity: warning, component: systemd }
        annotations: { summary: "systemd unit failed: {{ $labels.name }}" }

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 15m
        labels: { severity: warning, component: host }
        annotations: { summary: "WSL disk has less than 10 % free" }

      # The WSL virtual disk ("/" above, 1 TB) is a file on C: and can only grow while C: has room.
      - alert: HostDriveAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/mnt/c"} / node_filesystem_size_bytes{mountpoint="/mnt/c"} < 0.10
        for: 15m
        labels: { severity: warning, component: host }
        annotations: { summary: "Windows drive C: (holds the WSL virtual disk) has less than 10 % free" }

      - alert: SecurityUpdatesPending
        expr: gfilho_apt_upgradable{kind="security"} > 0
        for: 3d
        labels: { severity: info, component: host }
        annotations: { summary: "Security updates pending for more than 3 days" }

  # Rules above stop evaluating silently when their data disappears (probe_success == 0 has no result
  # when the blackbox exporter is down). These two make that visible.
  - name: gfilho-monitoring
    rules:
      - alert: ScrapeTargetDown
        expr: count by (job) (up{job!="cloudflared"} == 0)     # cloudflared is covered by TunnelDown
        for: 5m
        labels: { severity: warning, component: monitoring }
        annotations: { summary: "Prometheus cannot scrape {{ $labels.job }}: the alerts that use it cannot fire" }

      - alert: CustomMetricsStale
        expr: time() - gfilho_metrics_last_run_timestamp_seconds > 600
        for: 5m
        labels: { severity: warning, component: monitoring }
        annotations: { summary: "gfilho-metrics.timer has not run for 10 minutes: security.txt, updates, backups and WSL figures are stale" }
