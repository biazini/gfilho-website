# Installed as /etc/systemd/system/docker.service.d/requires-nftables.conf by monitoring/install-monitoring.sh.
# Grafana listens on the CT address and only the nftables rule keeps it NPM-only: if nftables fails at boot,
# Docker (and with it Grafana) must not start, so the stack fails closed instead of open.
[Unit]
Requires=nftables.service
After=nftables.service
