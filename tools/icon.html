<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<!-- Rendered to the PNG icons by tools/build-images.ps1.
     ?s=<px> sets the icon size (headless Chrome keeps a minimum window width, so vw/vh are unreliable);
     &bleed=1 uses logo-full-bleed.svg (no frame) for apple-touch-icon; the OS rounds the corners. -->
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#box{position:absolute;left:0;top:0;display:grid;place-items:center}
#box img{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="box"><img src="../site/favicon.svg" alt=""></div>
<script>
  var q = new URLSearchParams(location.search), s = parseInt(q.get('s') || '256', 10), box = document.getElementById('box');
  box.style.width = box.style.height = s + 'px';
  if (q.get('bleed') === '1') box.querySelector('img').src = 'logo-full-bleed.svg';
</script>
</body>
</html>
