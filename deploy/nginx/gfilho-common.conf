# Shared by the production and staging server blocks (see gfilho.conf).
# Installed as /etc/nginx/snippets/gfilho-common.conf by deploy/install-nginx.sh.

index index.html;
charset utf-8;
server_tokens off;

# Public traffic reaches nginx only through the Cloudflare Tunnel, which passes the
# visitor's scheme in CF-Visitor. Send http:// and www. to the canonical https://gfilho.net/.
set $gf_canonical "";
if ($host = "www.gfilho.net") { set $gf_canonical "1"; }
if ($http_cf_visitor ~ '"scheme":"http"') { set $gf_canonical "1"; }
if ($gf_canonical) { return 301 https://gfilho.net$request_uri; }

# Security headers (kept at server level: no location below uses add_header, so they are inherited)
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

gzip_vary on;
gzip_types text/css application/javascript image/svg+xml application/manifest+json text/xml text/plain;

# Directory redirects (/cases/x -> /cases/x/) stay relative. Otherwise nginx builds them from its own
# listener and sends visitors to http://gfilho.net:8088/..., which is not reachable from outside.
absolute_redirect off;

error_page 404 /404.html;
# Directories without an index.html (/assets/, /.well-known/, ...) look like any other missing page
error_page 403 =404 /404.html;

# /cases/ has no index page of its own: the case studies are listed in Projects
location = /cases/ { return 301 /#projects; }

location / {
    try_files $uri $uri/ =404;
    expires -1;                         # HTML: always revalidate (ETag)
}
location = /404.html { internal; expires -1; }

location ^~ /assets/fonts/ { expires 1y; }  # file names never change
location ^~ /assets/img/   { expires 30d; }
location ^~ /assets/css/   { expires 1h; }  # bump ?v= in index.html when these change
location ^~ /assets/js/    { expires 1h; }
location = /site.webmanifest { default_type application/manifest+json; expires 1d; }
location ~* \.(?:png|ico|svg|xml|txt)$ { expires 1d; }

# Never serve dotfiles, editor leftovers or backups that end up in the web root.
location ~ /\.(?!well-known/) { return 404; }
location ~* (?:\.(?:bak|old|orig|save|swp|tmp|dist)|~)$ { return 404; }
location ~* \.bak- { return 404; }
