# gfilho.net — installed as /etc/nginx/sites-available/gfilho.conf by deploy/install-nginx.sh.
# Both servers listen on loopback only: production is published by the Cloudflare Tunnel
# (ingress -> http://localhost:8088); staging is for local previews before a deploy.

# combined format plus response time and port; parsed by the monitoring stack (monitoring/)
log_format gfilho '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time port=$server_port';

# production
server {
    listen 127.0.0.1:8088 default_server;
    listen [::1]:8088 default_server;
    server_name gfilho.net www.gfilho.net localhost;
    root /var/www/html;
    access_log /var/log/nginx/access.log gfilho;
    include /etc/nginx/snippets/gfilho-common.conf;
}

# staging (local preview only); its own log keeps test traffic out of the production figures
server {
    listen 127.0.0.1:8089;
    listen [::1]:8089;
    server_name localhost;
    root /var/www/gfilho-staging;
    access_log /var/log/nginx/gfilho-staging.access.log gfilho;
    include /etc/nginx/snippets/gfilho-common.conf;
}

# connection and request counters for nginx-prometheus-exporter (monitoring/), loopback only
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    access_log off;
    location = /stub_status { stub_status; allow 127.0.0.1; deny all; }
    location / { return 404; }
}
